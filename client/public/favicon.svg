<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#0f0b1e" />
      <stop offset="100%" stop-color="#07050e" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Capsule Background -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Target / Guidance Orbit Rings -->
  <circle cx="32" cy="32" r="23" stroke="url(#glowRing)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.45" />
  <circle cx="32" cy="32" r="17" stroke="rgba(255,255,255,0.2)" stroke-width="1" opacity="0.6" />

  <!-- Upward Guidance Ray / Compass Pointer -->
  <path d="M32 10 L35 24 L32 20 L29 24 Z" fill="#38bdf8" opacity="0.85" filter="url(#glow)" />

  <!-- Graduation Cap (Mortarboard Diamond) -->
  <path d="M32 19 L49 28 L32 37 L15 28 Z" fill="url(#capGrad)" filter="url(#glow)" />
  <path d="M32 19 L49 28 L32 37 L15 28 Z" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" opacity="0.9" />

  <!-- Cap Base & Arch -->
  <path d="M22 33 V41 C22 44.5 42 44.5 42 41 V33" stroke="url(#capGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Tassel Ribbon & Pearl -->
  <path d="M41 28.5 L46 36 L46 41" stroke="#fbcfe8" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="46" cy="41" r="1.5" fill="#f472b6" />

  <!-- Sparkling North Star Beacon -->
  <circle cx="32" cy="28" r="2.2" fill="#ffffff" filter="url(#glow)" />
</svg>